[package]
name = "sam-blockchain"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "0.4.3"
sha2 = "0.11.0"
ed25519-dalek = {version = "2", features = ["rand_core"]} 
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"]}
